<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs>
    <linearGradient id="jdi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#214EC2"></stop>
      <stop offset="50%" stop-color="#19B9DF"></stop>
      <stop offset="100%" stop-color="#8A3DA6"></stop>
    </linearGradient>

    <filter id="jdi-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#19B9DF" flood-opacity=".35"></feDropShadow>
    </filter>

    <filter id="badge-glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs><rect width="512" height="512" rx="128" fill="#F0EBF5"></rect><g fill="url(#jdi-gradient)" filter="url(#jdi-glow)">

    <path d="M110 150 H175 V300 C175 340 145 365 110 365 C90 365 70 355 70 335 H115 C115 340 120 342 125 342 C135 342 140 330 140 310 V205 H110 Z"></path>

    <path fill-rule="evenodd" d="M205 150 H270 C315 150 345 180 345 256 C345 332 315 362 270 362 H205 Z M240 195 V317 H265 C285 317 305 300 305 256 C305 212 285 195 265 195 Z"></path>

    <path d="M365 150 H435 V190 H420 V322 H435 V362 H365 V322 H380 V190 H365 Z"></path>
  </g><circle cx="448" cy="105" r="13" fill="#19B9DF"></circle><g>
    <circle cx="414" cy="414" r="61" fill="#8A3DA6" filter="url(#badge-glow)" stroke="#FFFFFF" stroke-width="5"></circle>

    <!-- Documento blanco -->
    <path fill="#FFFFFF" d="
      M390 378
      H423
      L442 397
      V448
      Q442 454 436 454
      H390
      Q384 454 384 448
      V384
      Q384 378 390 378
      Z"></path>

    <!-- Esquina doblada -->
    <path fill="#8A3DA6" d="
      M423 378
      V392
      Q423 397 428 397
      H442
      Z"></path>

    <!-- Líneas del documento -->
    <g fill="none" stroke="#8A3DA6" stroke-width="4" stroke-linecap="round">
      <path d="M397 411 H429"></path>
      <path d="M397 423 H429"></path>
      <path d="M397 435 H421"></path>
    </g>

    <!-- Pulso sutil de luminosidad -->
    <animate attributeName="opacity" values="1;0.82;1" dur="2.8s" repeatCount="indefinite"></animate>
  </g><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>
